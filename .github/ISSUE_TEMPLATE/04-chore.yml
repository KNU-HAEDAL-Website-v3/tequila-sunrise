name: 🔧 설정 · 리팩터링
description: 빌드 설정, 패키지, 폴더 구조, 코드 정리 등 기능과 무관한 작업입니다
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        **사용자 눈에 보이는 동작이 바뀌지 않는 작업**에 사용합니다.
        패키지 설치, 설정 파일 수정, 폴더 구조 정리, 코드 정리, 테스트 추가 등.

        참고로 커밋 컨벤션에는 더 세분화된 이름도 있습니다.
        동작을 바꾸지 않고 코드 구조만 다듬는 작업이라면 제목을 `refactor: `,
        테스트 코드만 추가한다면 `test: ` 로 바꿔 적어도 좋습니다.

  - type: textarea
    id: detail
    attributes:
      label: 작업 내용
      placeholder: 컴포넌트 파일이 한 폴더에 모여 있어서 기능별 폴더로 나눕니다
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 이유
      description: 왜 지금 이 작업이 필요한가요
      placeholder: 파일이 30개를 넘어가면서 원하는 파일을 찾기 어려워졌습니다
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: false
