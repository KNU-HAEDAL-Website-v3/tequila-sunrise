name: ❓ 질문 · 토론
description: 궁금한 점을 묻거나, 함께 정할 것을 논의합니다
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        모르는 것을 묻는 것도 기록으로 남으면 다음 사람에게 도움이 됩니다.
        사소해 보이는 질문도 편하게 올려주세요.

  - type: dropdown
    id: kind
    attributes:
      label: 유형
      options:
        - 질문 - 모르는 것을 묻습니다
        - 토론 - 함께 정해야 할 것이 있습니다
        - 제안 - 이런 게 있으면 좋겠습니다
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: 내용
      description: 배경 상황을 함께 적어주시면 답변이 훨씬 정확해집니다
      placeholder: |
        상태 관리를 어떻게 할지 정하고 싶습니다.
        현재는 props로만 넘기고 있는데 depth가 4단계까지 깊어졌습니다.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 시도해본 것 / 검토한 선택지
      description: 질문이라면 어디까지 해봤는지, 토론이라면 어떤 안이 있는지 적어주세요
    validations:
      required: false
