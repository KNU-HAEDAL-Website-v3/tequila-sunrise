name: 🚨 버그 신고
description: 동작하지 않는 부분을 발견했습니다 (고치는 것은 나중에)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        발견한 내용만 적어주시면 됩니다. **원인을 몰라도 괜찮습니다.**

        직접 고칠 계획이라면 이 템플릿 대신 「🐛 버그 수정」을 사용해주세요.

  - type: textarea
    id: what
    attributes:
      label: 어떤 일이 일어났나요
      placeholder: 로그인 버튼을 눌렀는데 아무 반응이 없습니다
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 어떤 순서로 하면 다시 발생하나요
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대했던 동작
      placeholder: 로그인이 되고 메인 화면으로 이동해야 합니다
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 환경
      value: |
        - OS: 
        - 브라우저: 
        - 버전: 
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 에러 메시지 / 로그
      description: 콘솔이나 터미널에 나온 내용을 그대로 붙여넣어주세요. 자동으로 코드 블록이 됩니다.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: check
    attributes:
      label: 확인 사항
      options:
        - label: 이미 등록된 이슈가 없는지 검색해봤습니다
          required: true
