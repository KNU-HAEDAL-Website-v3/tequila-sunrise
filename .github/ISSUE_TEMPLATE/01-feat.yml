name: ✨ 기능 개발
description: 새로운 기능을 직접 개발합니다
title: "feat: "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        제목의 `feat: ` 뒤에 **무엇을 만드는지** 이어서 적어주세요.

        이 제목은 그대로 커밋 메시지가 됩니다.
        - 이슈 제목 → `feat: 로그인 화면 추가`
        - 브랜치 → `feat/login`
        - 커밋 → `feat: 로그인 화면 추가`

  - type: textarea
    id: summary
    attributes:
      label: 개발할 기능
      description: 무엇을 만드는지 한두 문장으로 적어주세요
      placeholder: 이메일과 비밀번호로 로그인하는 화면을 만듭니다
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크박스로 쪼개두면 작업하면서 하나씩 체크할 수 있습니다
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: ref
    attributes:
      label: 참고 자료
      description: 디자인 시안, 문서 링크, 관련 이슈 번호(#12) 등
    validations:
      required: false

  - type: input
    id: due
    attributes:
      label: 예상 완료일
      placeholder: 2026-08-03
    validations:
      required: false
